services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: bandit-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [bandit-net]

  mlflow:
    build:
      context: .
      dockerfile: mlops/mlflow.Dockerfile
    container_name: bandit-mlflow
    user: "${HOST_UID:-1000}:0"
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlruns
    networks: [bandit-net]

  service:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: bandit-service
    user: "${HOST_UID:-1000}:0"
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MLFLOW_TRACKING_URI: http://mlflow:5000
      BANDIT_POLICY: linucb
      CANDIDATE_POOL_SIZE: "15"
      LIVE_FEEDBACK_PATH: /mlruns/live_feedback.jsonl
    # MLflow's local-artifact-store backend has clients read/write artifacts directly
    # on disk (not proxied through the tracking server's HTTP API), so every client
    # needs the same /mlruns path mounted -- not just the mlflow server container.
    volumes:
      - ./mlruns:/mlruns
    depends_on: [kafka, mlflow]
    networks: [bandit-net]

  postgres:
    image: postgres:15
    container_name: bandit-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [bandit-net]

  airflow:
    build:
      context: .
      dockerfile: mlops/Dockerfile
    container_name: bandit-airflow
    user: "${HOST_UID:-1000}:0"
    command: standalone
    ports:
      - "8081:8080"
    environment:
      # AIRFLOW_HOME intentionally left at the image's own default (/opt/airflow),
      # NOT inside the bind-mounted /app -- putting SQLite state (and a stale
      # webserver PID file across restarts) inside a host-mounted directory caused
      # standalone startup to hang on the next `docker compose up` after a recreate.
      AIRFLOW__CORE__DAGS_FOLDER: /app/mlops/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FORCE_RETRAIN: "false"
      LIVE_FEEDBACK_PATH: /mlruns/live_feedback.jsonl
      PYTHONPATH: /app
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 16
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    working_dir: /app
    volumes:
      - .:/app
      - ./mlruns:/mlruns
    depends_on: [mlflow, postgres]
    networks: [bandit-net]

networks:
  bandit-net:
    driver: bridge
