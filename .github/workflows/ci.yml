name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint + test dependencies
        run: pip install ruff==0.5.0 pytest==8.2.2 pip-audit==2.7.3

      - name: Install runtime dependencies used by tests
        run: |
          pip install numpy==1.26.4 scipy==1.13.1 pandas==2.2.2 pyarrow==15.0.0 \
                      fastapi==0.111.0 "uvicorn[standard]==0.30.1" pydantic==2.7.4 \
                      kafka-python-ng==2.2.3 httpx==0.27.0 mlflow==2.14.1

      - name: Lint (ruff)
        run: ruff check .

      - name: Format Check (ruff)
        run: ruff format --check .

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Unit + Contract tests (pytest)
        run: pytest tests/ -v

      - name: Build Docker image
        run: docker build -t music-recom-service -f service/Dockerfile .
