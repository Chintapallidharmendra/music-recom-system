name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint + test dependencies
        run: pip install ruff==0.5.0 pytest==8.2.2

      - name: Install runtime dependencies used by tests
        run: |
          pip install numpy==1.26.4 scipy==1.13.1 pandas==2.2.2 pyarrow==16.1.0 \
                      fastapi==0.111.0 "uvicorn[standard]==0.30.1" pydantic==2.7.4 \
                      kafka-python-ng==2.2.3 httpx==0.27.0 mlflow==2.14.1

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests -- bandit policies (no fixture data required)
        run: pytest tests/test_bandit_policies.py -v

      # tests/test_api_contract.py needs data/{features,synthetic_logs,user_profiles}.parquet,
      # which come from Track A's pipeline over the (gitignored) FMA-small audio dataset --
      # not available in CI. Contract tests run locally against real generated fixtures;
      # this job covers the fully hermetic bandit-policy suite on every push.
